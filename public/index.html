<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HamroGadget — Nepal's Premier Tech Store</title>
  <meta name="description" content="Shop the latest laptops, phones, headphones, smartwatches and accessories in Nepal. Genuine products, warranty, and nationwide delivery.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563eb'/><text x='4' y='23' font-family='Inter,sans-serif' font-weight='800' font-size='18' fill='white'>HG</text></svg>">
</head>
<body>
  <!-- ===== HEADER / NAV ===== -->
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a href="#/" class="logo" aria-label="HamroGadget Home">
        <svg class="logo-icon" viewBox="0 0 36 36" width="36" height="36" aria-hidden="true">
          <rect width="36" height="36" rx="8" fill="var(--accent)"/>
          <text x="4" y="25" font-family="Inter,sans-serif" font-weight="800" font-size="19" fill="#fff">HG</text>
        </svg>
        <span class="logo-text">Hamro<strong>Gadget</strong></span>
      </a>

      <nav class="main-nav" id="main-nav" aria-label="Main navigation">
        <ul class="nav-links" id="nav-links">
          <li><a href="#/" class="nav-link" data-nav="home">Home</a></li>
          <li><a href="#/category/Laptops" class="nav-link" data-nav="Laptops">Laptops</a></li>
          <li><a href="#/category/Phones" class="nav-link" data-nav="Phones">Phones</a></li>
          <li><a href="#/category/Headphones" class="nav-link" data-nav="Headphones">Headphones</a></li>
          <li><a href="#/category/Smartwatches" class="nav-link" data-nav="Smartwatches">Watches</a></li>
          <li><a href="#/category/Accessories" class="nav-link" data-nav="Accessories">Accessories</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <div class="search-box" id="search-box">
          <svg class="search-icon" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="6"/>
            <line x1="13" y1="13" x2="18" y2="18"/>
          </svg>
          <input type="search" id="search-input" placeholder="Search gadgets…" autocomplete="off" aria-label="Search products">
        </div>

        <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
          </svg>
        </button>

        <!-- Authentication Actions (Log In & Sign Up) -->
        <div class="auth-buttons-group" id="auth-buttons-group">
          <button class="btn btn-sm btn-outline" id="nav-login-btn">Log In</button>
          <button class="btn btn-sm btn-primary" id="nav-signup-btn">Sign Up</button>
        </div>

        <!-- Authenticated Profile Menu -->
        <div class="user-menu-group" id="user-menu-group" style="display: none;">
          <!-- Dynamically populated when user or admin logs in -->
        </div>

        <button class="icon-btn hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== MOBILE NAV DRAWER ===== -->
  <div class="nav-drawer-overlay" id="nav-drawer-overlay"></div>
  <aside class="nav-drawer" id="nav-drawer" aria-label="Mobile navigation">
    <div class="drawer-header">
      <span class="logo-text">Hamro<strong>Gadget</strong></span>
      <button class="icon-btn drawer-close" id="drawer-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <nav>
      <ul class="drawer-links" id="drawer-links">
        <li><a href="#/">Home</a></li>
        <li><a href="#/category/Laptops">Laptops</a></li>
        <li><a href="#/category/Phones">Phones</a></li>
        <li><a href="#/category/Headphones">Headphones</a></li>
        <li><a href="#/category/Smartwatches">Watches</a></li>
        <li><a href="#/category/Accessories">Accessories</a></li>
      </ul>
    </nav>
    <div class="drawer-auth-section" id="drawer-auth-section" style="padding: 20px 16px; border-top: 1px solid var(--border); margin-top: 16px; display: flex; flex-direction: column; gap: 10px;">
      <!-- Populated dynamically by app.js -->
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content" id="main-content">
    <!-- Dynamically rendered by app.js -->
    <div class="loading-screen" id="loading-screen">
      <div class="spinner"></div>
      <p>Loading HamroGadget…</p>
    </div>
  </main>

  <!-- ===== ADMIN PANEL ===== -->
  <section class="admin-panel" id="admin-panel" hidden>
    <!-- Rendered by app.js when admin is authenticated -->
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer" id="site-footer">
    <!-- Rendered by app.js -->
  </footer>

  <!-- ===== MODALS ===== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="Close modal">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div class="modal-body" id="modal-body">
        <!-- Dynamic modal content -->
      </div>
    </div>
  </div>

  <!-- ===== TOAST CONTAINER ===== -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="/js/app.js"></script>
</body>
</html>
